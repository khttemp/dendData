<html>
    <head>
        <meta charset="utf-8">
        <title>電Ⅾコマンドリスト</title>
        <script src="./js/safeHtml.js"></script>
        <script src="./js/cmd.js"></script>
        <script defer src="./js/cmdList.js"></script>
        <style>
            #tableSection {
                overflow-y: scroll;
                height: calc(100% - 230px);
            }
            #tableSection table {
                border-collapse: separate;
                border-spacing: 2px;
                border: 1px solid #A8A8A8;
            }
            #tableSection th,
            #tableSection td {
                border: 1px inset #545454;
            }
        </style>
    </head>
    <body>
        <main>
            <article>
                <section>
                    <nav>
                        <a href="perType.html" target="_blank">電Ⅾの変化方法の式</a>
                        <br>
                        <a href="scriptViewer.html" target="_blank">電ⅮコミックスクリプトViewer</a>
                        <br>
                        <a href="cpuMode/cpuMode.html" target="_blank">CPUモードの説明</a>
                    </nav>
                </section>
                <br>
                <section>
                    <div>
                        <input type="checkbox" id="modelCheck">
                        <label for="modelCheck">モデルバイナリを除外する</label>
                    </div>
                    <div>
                        <input type="checkbox" id="notDefined">
                        <label for="notDefined">未定義のコマンドを除外する</label>
                    </div>
                    <div>
                        <input type="checkbox" id="allNotUsed">
                        <label for="allNotUsed">全く使われてないコマンドを除外する</label>
                    </div>
                </section>
                <br>
                <section>
                    <div>
                        絞り込むゲームを選択する（AND条件）
                    </div>
                    <input type="checkbox" id="LSCheck">
                    <label for="LSCheck">LS</label>
                    <input type="checkbox" id="BSCheck">
                    <label for="BSCheck">BS</label>
                    <input type="checkbox" id="CSCheck">
                    <label for="CSCheck">CS</label>
                    <input type="checkbox" id="RSCheck">
                    <label for="RSCheck">RS</label>
                    <input type="checkbox" id="SSCheck">
                    <label for="SSCheck">SS</label>
                </section>
                <br>
                <section>
                    <div>
                        コマンド名で絞り込む
                    </div>
                    <input type="text" id="cmdName" style="width:18rem;">
                </section>
                <br>
                <section>
                    <div id="cmdCountDiv"></div>
                    <div id="errorDiv"></div>
                </section>
            </article>
            <hr>
            <article>
                <section id="tableSection">
                    <table>
                        <thead>
                            <tr>
                                <th>番号</th>
                                <th>コマンド名</th>
                                <th>説明</th>
                                <th colspan="5">使われたゲーム</th>
                            </tr>
                        </thead>
                        <tbody id="cmdTableData"></tbody>
                    </table>
                </section>
            </article>
        </main>
    </body>
</html>
