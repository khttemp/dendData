<html>
    <head>
        <meta charset="utf-8">
        <title>電ⅮコミックスクリプトViewer</title>
        <script src="./js/safeHtml.js"></script>
        <script src="./js/cmd.js"></script>
        <script defer src="./js/scriptViewer.js"></script>
        <style>
            #scriptTableData {
                border-collapse: separate;
                border-spacing: 2px;
                border: 1px solid #A8A8A8;
            }
            #scriptTableData td {
                border: 1px inset #545454;
            }

            .scriptList {
                padding-left: 12px;
                padding-right: 12px;
                text-align: center;
                min-width: 50px;
            }
            .cmd-property {
                cursor: pointer;
                color: blue;
                text-decoration: underline;
            }

            #custom-tooltip {
                position: absolute;
                padding: 8px 12px;
                background-color: rgba(0, 0, 0, 0.8);
                color: #fff;
                border-radius: 4px;
                font-size: 14px;
                white-space: pre-line;
                pointer-events: none;
            }

            .hidden-tooltip {
                visibility: hidden;
                opacity: 0;
                transform: translateY(15px);
                transition: opacity 0.25s ease-out, transform 0.25s ease-out;
            }
            .hidden-tooltip.active {
                visibility: visible;
                opacity: 1;
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <main>
            <article>
                <section>
                    <nav>
                        <a href="cmdList.html" target="_blank">コマンドリスト</a>
                    </nav>
                    <div>コミックスクリプトのbinファイルを添付してください</div>
                </section>
                <br>
                <section>
                    <div>ゲーム（CHK_TRAIN_TYPEのindex判定に使う）</div>
                    <div>
                        <input type="radio" name="series" id="radioLS" value="LS" /><label for="radioLS">LS</label>
                        <input type="radio" name="series" id="radioBS" value="BS" /><label for="radioBS">BS</label>
                        <input type="radio" name="series" id="radioCS" value="CS" /><label for="radioCS">CS</label>
                        <input type="radio" name="series" id="radioRS" value="RS" /><label for="radioRS">RS</label>
                        <input type="radio" name="series" id="radioSS" value="SS" /><label for="radioSS">SS</label>
                    </div>
                </section>
                <br>
                <section>
                    <button id="fileUploadBtn">ファイルを選択</button>
                    <input type="file" id="file" style="display: none;"> 
                    <label id="fileName" for="fileUploadBtn">選択されていません</label>
                </section>
                <section>
                    <div id="errorDiv" style="white-space: pre-wrap;"></div>
                </section>
                <hr>
            </article>
            <article>
                <section>
                    <table id="scriptTableData"></table>
                    <div id="custom-tooltip" class="hidden-tooltip"></div>
                </section>
            </article>
        </main>
    </body>
</html>
